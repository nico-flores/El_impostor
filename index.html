<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Impostor</title>

<style>
* {
  box-sizing: border-box;
  font-family: system-ui, Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #0f0f0f;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 16px;
}

.card {
  background: #1c1c1c;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.6);
}

h1, h2 {
  text-align: center;
  margin: 0 0 16px 0;
}

input, select, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
}

button {
  background: #4caf50;
  color: #fff;
  font-weight: 600;
}

button.secondary {
  background: #444;
}

label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  font-size: 14px;
}

.hidden {
  display: none;
}

.result {
  text-align: center;
  font-size: 26px;
  margin: 24px 0;
  line-height: 1.4;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <!-- SETUP -->
    <div id="setup">
      <h1>El Impostor</h1>

      <input id="players" type="number" min="3" value="3">
      <input id="impostors" type="number" min="1" value="1">

      <select id="category">
        <option value="">Cargando categorías...</option>
      </select>

      <label>
        <input type="checkbox" id="hintToggle">
        Pista para impostor
      </label>

      <button onclick="startGame()">Comenzar</button>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden">
      <h2 id="playerTitle"></h2>

      <button onclick="reveal()">Ver palabra</button>

      <div id="result" class="result"></div>

      <button class="secondary" onclick="nextPlayer()">Siguiente</button>
    </div>

  </div>
</div>

<script>
let palabras = [];
let roles = [];
let indice = 0;
let palabraActual = null;
let pistaActiva = false;

// Cargar JSON
fetch("palabras_impostor.json")
  .then(res => res.json())
  .then(data => {
    palabras = data;
    const categorias = [...new Set(data.map(p => p.categoria))];
    const select = document.getElementById("category");
    select.innerHTML = "";
    categorias.forEach(cat => {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  })
  .catch(err => {
    alert("Error cargando palabras_impostor.json");
    console.error(err);
  });

function startGame() {
  const jugadores = parseInt(players.value);
  const impostores = parseInt(impostors.value);

  if (!category.value) {
    alert("Seleccioná una categoría");
    return;
  }

  if (impostores >= jugadores) {
    alert("Los impostores deben ser menos que los jugadores");
    return;
  }

  pistaActiva = hintToggle.checked;

  roles = [
    ...Array(jugadores - impostores).fill("normal"),
    ...Array(impostores).fill("impostor")
  ].sort(() => Math.random() - 0.5);

  const lista = palabras.filter(p => p.categoria === category.value);
  palabraActual = lista[Math.floor(Math.random() * lista.length)];

  indice = 0;
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  mostrarJugador();
}

function mostrarJugador() {
  document.getElementById("playerTitle").textContent = "Jugador " + (indice + 1);
  document.getElementById("result").innerHTML = "";
}

function reveal() {
  const result = document.getElementById("result");

  if (roles[indice] === "impostor") {
    result.innerHTML = `
      <strong>IMPOSTOR</strong><br>
      ${pistaActiva ? "pista: " + palabraActual.pista : ""}
    `;
  } else {
    result.textContent = palabraActual.palabra;
  }
}

function nextPlayer() {
  indice++;
  if (indice >= roles.length) {
    location.reload();
  } else {
    mostrarJugador();
  }
}
</script>

</body>
</html>
